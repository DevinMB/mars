name: Security

# GitHub's own code and secret scanning need Advanced Security on private repos,
# so these run the open-source equivalents in CI. The weekly run matters as much
# as the push trigger: new vulnerabilities are published against code and images
# that have not changed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secrets in git history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo:ro" zricethezav/gitleaks:v8.30.1
          git /repo --redact --no-banner --exit-code 1

  code:
    name: Code analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: >
          docker run --rm -v "$PWD:/src:ro" -w /src semgrep/semgrep:1.179.0
          semgrep scan --config p/default --metrics=off --error --exclude frontend/dist

  image:
    name: Console image vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # --pull so the scan sees today's base image, which is what a release ships.
      - name: Build
        run: docker build --pull -f backend/Dockerfile -t mars-console:scan .
      # Fixable high and critical findings fail the run. Unfixable ones would
      # fail every run with nothing to do about them.
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0 image --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 mars-console:scan

  flink-image:
    name: Flink image vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Base image plus the Kafka connector and client JARs. The MARS connectors
      # are build output from another repo and are scanned there.
      - name: Build
        run: docker build --pull -t mars-flink:scan flink
      - name: Trivy
        run: >
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.75.0 image --scanners vuln --severity HIGH,CRITICAL
          --ignore-unfixed --exit-code 1 mars-flink:scan
