name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Unit tests
        run: python -m pytest tests --ignore=tests/integration
      # The migration steps share one throwaway database, separate from the tests.
      - name: Point migrations at an empty database
        run: |
          mkdir -p "$RUNNER_TEMP/mars"
          echo "MARS_DATA_DIR=$RUNNER_TEMP/mars" >> "$GITHUB_ENV"
          echo "MARS_DATABASE_URL=sqlite:///$RUNNER_TEMP/mars-ci.db" >> "$GITHUB_ENV"
      # Two migrations claiming the same parent would leave upgrades ambiguous.
      - name: One migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Migrations apply to an empty database
        run: alembic upgrade head
      # Fails when a model changes without a migration, which otherwise only
      # shows up as a missing column on the first upgraded install.
      - name: Models match migrations
        run: alembic check
      - name: Python dependency audit
        run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Fails on anything that ships to the browser. Build tooling is kept up to
      # date through Dependabot rather than blocking every change.
      - name: Production dependency audit
        run: npm audit --omit=dev

  image:
    name: Console image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build
        run: docker build -f backend/Dockerfile -t mars-console:ci .

  security:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/security.yml

  # The Dependabot gate, after everything above passes: patch and minor updates
  # merge, then release.yml runs on main (a merge made with GITHUB_TOKEN starts no
  # push workflow; dispatch is the documented exception). Majors get the
  # waits-for-you label and wait for a person.
  gate:
    needs: [backend, frontend, image, security]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Merge patch and minor updates, then build main
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          UPDATE: ${{ steps.meta.outputs.update-type }}
        run: |
          set -eu
          gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge --delete-branch
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "### Merged #$PR ($UPDATE) and started the main build" >> "$GITHUB_STEP_SUMMARY"

      - name: Majors wait for you
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh label create waits-for-you --repo "$GITHUB_REPOSITORY" --color FBCA04 \
            --description "A major update: merge it after a look" 2>/dev/null || true
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label waits-for-you
