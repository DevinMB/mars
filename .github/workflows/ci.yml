name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pytest==9.1.1 pytest-asyncio==1.4.0
      - name: Unit tests
        run: python -m pytest tests --ignore=tests/integration
      # The migration steps share one throwaway database, separate from the tests.
      - name: Point migrations at an empty database
        run: |
          mkdir -p "$RUNNER_TEMP/mars"
          echo "MARS_DATA_DIR=$RUNNER_TEMP/mars" >> "$GITHUB_ENV"
          echo "MARS_DATABASE_URL=sqlite:///$RUNNER_TEMP/mars-ci.db" >> "$GITHUB_ENV"
      # Two migrations claiming the same parent would leave upgrades ambiguous.
      - name: One migration head
        run: test "$(alembic heads | wc -l)" -eq 1
      - name: Migrations apply to an empty database
        run: alembic upgrade head
      # Fails when a model changes without a migration, which otherwise only
      # shows up as a missing column on the first upgraded install.
      - name: Models match migrations
        run: alembic check
      - name: Python dependency audit
        run: pip install pip-audit==2.9.0 && pip-audit -r requirements.txt

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Fails on anything that ships to the browser. Build tooling is kept up to
      # date through Dependabot rather than blocking every change.
      - name: Production dependency audit
        run: npm audit --omit=dev

  image:
    name: Console image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build
        run: docker build -f backend/Dockerfile -t mars-console:ci .
