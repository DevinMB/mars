# Weekly update PRs, grouped so each ecosystem produces one PR rather than one per
# package. Security updates arrive as soon as an advisory is published, separately
# from this schedule, once Dependabot security updates are enabled in Settings.
version: 2
# Groups take minor and patch updates only. Each major upgrade arrives as its own
# PR, so one breaking change cannot hold back the safe updates grouped with it.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release: malicious or broken versions
    # are usually pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release: malicious or broken versions
    # are usually pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      # Build tooling never reaches the browser, so it is batched on its own and
      # a failing tooling update does not hold back a runtime fix.
      build-tooling:
        dependency-type: development
        patterns: ["*"]
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        patterns: ["*"]
        update-types: [minor, patch]

  # Base images: python and node for the console, Flink for the cluster image.
  # The Kafka JARs downloaded in flink/Dockerfile are build arguments, which
  # Dependabot cannot see; the Flink image scan in security.yml covers them.
  - package-ecosystem: docker
    directories: [/backend, /flink]
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release: malicious or broken versions
    # are usually pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Wait a week before proposing a new release: malicious or broken versions
    # are usually pulled within days. Security updates are not delayed.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
