# MARS Flink session cluster configuration.
#
# Sized for a small single-host deployment. The slot count is deliberately high
# relative to memory: MARS jobs are typically many small SQL pipelines rather than
# a few large ones, and each needs its own slot.

jobmanager:
  rpc:
    address: jobmanager
    port: 6123
  memory:
    process:
      size: 1024m
  bind-host: 0.0.0.0
  execution:
    failover-strategy: region

taskmanager:
  bind-host: 0.0.0.0
  host: taskmanager
  numberOfTaskSlots: 12
  memory:
    process:
      size: 2560m

parallelism:
  default: 1

rest:
  address: 0.0.0.0
  bind-address: 0.0.0.0

# The Flink REST API has no authentication and never has -- upstream's position
# is that you put it behind something that does. :8081 is published to a LAN
# this host does not own, so until 2026-09-22 anyone on that network could POST
# a JAR to /jars/upload and then run it. That is arbitrary code execution on the
# box that also holds Kafka, CouchDB and the MARS database.
#
# These two flags remove that path at the source, independent of any firewall
# rule or proxy in front. Nothing here uses it: MARS submits through the SQL
# Gateway, and stops and cancels jobs through its own API, not the web UI.
# Verified before setting this -- all nine jobs were submitted via the gateway.
#
# The UI itself still works. It becomes read-only for job lifecycle, which is
# what it should always have been given the console owns that.
web:
  submit:
    enable: false
  cancel:
    enable: false

# Checkpointing is on by default: a MARS job that cannot recover is not much use.
execution:
  checkpointing:
    interval: 30s
    min-pause: 10s
    timeout: 10min
    externalized-checkpoint-retention: RETAIN_ON_CANCELLATION

state:
  backend:
    type: hashmap
  checkpoints:
    dir: file:///flink-state/checkpoints
  savepoints:
    dir: file:///flink-state/savepoints

metrics:
  reporters: prom
  reporter:
    prom:
      factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      port: 9249

# Async UDFs (the Ollama enricher) need a bounded queue and a timeout that
# accommodates a slow model without stalling the pipeline forever.
table:
  exec:
    async-scalar:
      buffer-capacity: 10
      timeout: 3min
      max-attempts: 3
      retry-strategy: FIXED_DELAY
      retry-delay: 5s
