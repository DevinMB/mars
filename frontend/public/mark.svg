<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- The MARS mark. Same three shapes as the in-app component: a browser tab is
       16 pixels, where the full illustration is unreadable. -->
  <defs>
    <linearGradient id="p" x1="7" y1="6" x2="24" y2="27" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fb923c"/><stop offset="0.55" stop-color="#ea580c"/><stop offset="1" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="r" x1="2" y1="22" x2="30" y2="10" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f97316"/><stop offset="0.5" stop-color="#fdba74"/><stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
    <mask id="b">
      <rect width="32" height="32" fill="white"/>
      <circle cx="15" cy="15" r="9.6" fill="black"/>
    </mask>
  </defs>
  <rect width="32" height="32" rx="7" fill="#0f172a"/>
  <g mask="url(#b)">
    <ellipse cx="16" cy="17" rx="13.2" ry="4.8" transform="rotate(-24 16 17)"
             stroke="url(#r)" stroke-width="2.1" stroke-linecap="round"/>
  </g>
  <circle cx="15" cy="15" r="8.4" fill="url(#p)"/>
  <circle cx="11.8" cy="12.4" r="2" fill="#7c2d12" opacity="0.26"/>
  <circle cx="17.4" cy="17.8" r="1.3" fill="#7c2d12" opacity="0.22"/>
  <path d="M5 21.9C8.3 23.7 13.4 23.9 18.6 22.1" stroke="url(#r)" stroke-width="2.1" stroke-linecap="round"/>
  <rect x="23.4" y="8.6" width="2.7" height="2.7" rx="0.6" transform="rotate(-24 23.4 8.6)" fill="#fb923c"/>
</svg>
