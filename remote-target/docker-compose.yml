# A MARS execution target on its own machine.
#
# Copy this directory to the host you want jobs to run on, set .env, and:
#
#     docker compose up -d
#
# Then register it in MARS under Cluster -> targets, using this machine's address:
#
#     Flink REST url : http://<this-host>:8081
#     Gateway url    : http://<this-host>:8083
#
name: mars-target

services:
  jobmanager:
    image: ${MARS_FLINK_IMAGE:-mars/flink:0.1.0}
    container_name: mars-target-jobmanager
    command: jobmanager
    restart: unless-stopped
    ports:
      # MARS talks to these two. They must be reachable from wherever the console
      # runs -- which is the only firewall rule this needs.
      - "${TARGET_BIND_ADDRESS:-127.0.0.1}:${TARGET_REST_PORT:-8081}:8081"
      # Prometheus metrics, for whatever monitors this machine. Optional to scrape;
      # unauthenticated, like the two above.
      - "${TARGET_BIND_ADDRESS:-127.0.0.1}:${TARGET_JM_METRICS_PORT:-9249}:9249"
    volumes:
      - ./conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
      - flink-state:/flink-state
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: ${JOBMANAGER_MEM:-1280m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [mars-target]

  taskmanager:
    image: ${MARS_FLINK_IMAGE:-mars/flink:0.1.0}
    command: taskmanager
    restart: unless-stopped
    depends_on:
      jobmanager: { condition: service_healthy }
    ports:
      # The TaskManager's metrics: job throughput, backpressure, memory. 9250 on the
      # host, since the JobManager already has 9249.
      - "${TARGET_BIND_ADDRESS:-127.0.0.1}:${TARGET_TM_METRICS_PORT:-9250}:9249"
    volumes:
      - ./conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
      - flink-state:/flink-state
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: ${TASKMANAGER_MEM:-2560m}
    networks: [mars-target]

  sql-gateway:
    image: ${MARS_FLINK_IMAGE:-mars/flink:0.1.0}
    container_name: mars-target-gateway
    restart: unless-stopped
    depends_on:
      jobmanager: { condition: service_healthy }
    ports:
      - "${TARGET_BIND_ADDRESS:-127.0.0.1}:${TARGET_GATEWAY_PORT:-8083}:8083"
    command: >
      /opt/flink/bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.rest.address=0.0.0.0
      -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
      -Drest.address=jobmanager
      -Drest.port=8081
    volumes:
      - ./conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: 768m
    networks: [mars-target]

volumes:
  flink-state:

networks:
  mars-target:
