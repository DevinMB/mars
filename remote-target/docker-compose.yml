# A MARS execution target on its own machine.
#
# Copy this directory to the host you want jobs to run on, set .env, and:
#
#     docker compose up -d
#
# Then register it in MARS under Cluster -> targets, using this machine's address:
#
#     Flink REST url : http://<this-host>:8081
#     Gateway url    : http://<this-host>:8083
#
# WHY A WHOLE CLUSTER AND NOT JUST A WORKER
#
# Adding a TaskManager to the existing cluster would give more slots, but Flink's
# scheduler places tasks in whatever slot is free -- there is no supported way to
# say "this job belongs on that machine". Capacity would grow; control would not.
# Running a cluster here makes this machine addressable, so a job can be sent to it
# deliberately.
#
# The trade-off is honest: each cluster carries its own JobManager, so a second
# target costs roughly a gigabyte of overhead before it runs anything. That is the
# price of placement.

name: mars-target

services:
  jobmanager:
    image: ${MARS_FLINK_IMAGE:-mars/flink:0.1.0}
    container_name: mars-target-jobmanager
    command: jobmanager
    restart: unless-stopped
    ports:
      # MARS talks to these two. They must be reachable from wherever the console
      # runs -- which is the only firewall rule this needs.
      - "${TARGET_REST_PORT:-8081}:8081"
    volumes:
      - ./conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
      - flink-state:/flink-state
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: ${JOBMANAGER_MEM:-1280m}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [mars-target]

  taskmanager:
    image: ${MARS_FLINK_IMAGE:-mars/flink:0.1.0}
    command: taskmanager
    restart: unless-stopped
    depends_on:
      jobmanager: { condition: service_healthy }
    volumes:
      - ./conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
      - flink-state:/flink-state
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: ${TASKMANAGER_MEM:-2560m}
    # Scale workers within this machine with:
    #   docker compose up -d --scale taskmanager=3
    networks: [mars-target]

  sql-gateway:
    image: ${MARS_FLINK_IMAGE:-mars/flink:0.1.0}
    container_name: mars-target-gateway
    restart: unless-stopped
    depends_on:
      jobmanager: { condition: service_healthy }
    ports:
      - "${TARGET_GATEWAY_PORT:-8083}:8083"
    command: >
      /opt/flink/bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.rest.address=0.0.0.0
      -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
      -Drest.address=jobmanager
      -Drest.port=8081
    volumes:
      - ./conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: 768m
    networks: [mars-target]

volumes:
  flink-state:

networks:
  mars-target:
    name: mars-target
