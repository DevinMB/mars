# MARS - stream pipelines for Apache Flink(R)
#
#   cp .env.example .env && docker compose up -d
#
# Brings up a Flink session cluster, a SQL Gateway, and the MARS console.
name: mars

# Image and network names are scoped to the Compose project.

services:
  jobmanager:
    build:
      context: ./flink
      dockerfile: Dockerfile
    image: ${MARS_FLINK_IMAGE:-${COMPOSE_PROJECT_NAME:-mars}/flink:0.1.0}
    container_name: mars-jobmanager
    command: jobmanager
    restart: unless-stopped
    ports:
      - "${MARS_FLINK_BIND_ADDRESS:-127.0.0.1}:${MARS_FLINK_UI_PORT:-8081}:8081"
    volumes:
      - ./flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
      - flink-state:/flink-state
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: 1280m
    cpus: 0.75
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [mars]

  taskmanager:
    image: ${MARS_FLINK_IMAGE:-${COMPOSE_PROJECT_NAME:-mars}/flink:0.1.0}
    container_name: mars-taskmanager
    command: taskmanager
    restart: unless-stopped
    depends_on:
      jobmanager:
        condition: service_healthy
    volumes:
      - ./flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
      - flink-state:/flink-state
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: 2816m
    cpus: 1.0
    networks: [mars]

  sql-gateway:
    image: ${MARS_FLINK_IMAGE:-${COMPOSE_PROJECT_NAME:-mars}/flink:0.1.0}
    container_name: mars-sql-gateway
    restart: unless-stopped
    depends_on:
      jobmanager:
        condition: service_healthy
    command: >
      /opt/flink/bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.rest.address=0.0.0.0
      -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
      -Drest.address=jobmanager
      -Drest.port=8081
    volumes:
      - ./flink/conf/config.yaml:/opt/flink/conf/config.yaml:ro,z
    environment:
      - TZ=${TZ:-UTC}
    mem_limit: 768m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/v1/info || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [mars]

  console:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: ${MARS_CONSOLE_IMAGE:-${COMPOSE_PROJECT_NAME:-mars}/console:0.1.0}
    container_name: mars-console
    # Picked up by a Prometheus that discovers containers by these labels; ignored
    # otherwise. /metrics is unauthenticated, like /healthz.
    labels:
      prometheus.scrape: "true"
      prometheus.port: "8080"
    restart: unless-stopped
    depends_on:
      sql-gateway:
        condition: service_healthy
    ports:
      - "${MARS_CONSOLE_BIND_ADDRESS:-127.0.0.1}:${MARS_CONSOLE_PORT:-8080}:8080"
    volumes:
      - console-data:/data
      # Read-only view of the connector JARs, so the console can read the
      # manifests inside them and offer a form per connector.
      - ./flink/jars:/jars:ro,z
    environment:
      - TZ=${TZ:-UTC}
      - MARS_FLINK_REST_URL=http://jobmanager:8081
      - MARS_SQL_GATEWAY_URL=http://sql-gateway:8083
      # Optional; see .env.example. Unset is correct for a stock deployment.
      - MARS_FLINK_UI_URL=${MARS_FLINK_UI_URL:-}
      - MARS_CONNECTOR_LIB_DIR=/jars
      - MARS_SESSION_COOKIE_SECURE=${MARS_SESSION_COOKIE_SECURE:-false}
      - MARS_SESSION_COOKIE=${MARS_SESSION_COOKIE:-mars_session}
      - MARS_SESSION_TTL_HOURS=${MARS_SESSION_TTL_HOURS:-12}
      - MARS_SEED_EXAMPLES=${MARS_SEED_EXAMPLES:-true}
      # Shown when adding a cluster, so a new one runs this exact image.
      - MARS_FLINK_IMAGE=${MARS_FLINK_IMAGE:-${COMPOSE_PROJECT_NAME:-mars}/flink:0.1.0}
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [mars]

  # ---------------------------------------------------------------------------
  # A second execution target.
  #
  # Flink schedules tasks into whatever slot a cluster has free, and offers no way
  # to pin a job to one machine inside a cluster. Running a second cluster is how
  # placement is actually expressed: register it in MARS under Cluster, then pick it
  # per job.
  #
  # Enable with:  docker compose --profile second-target up -d
  # ---------------------------------------------------------------------------
  jobmanager-b:
    image: ${MARS_FLINK_IMAGE:-${COMPOSE_PROJECT_NAME:-mars}/flink:0.1.0}
    container_name: mars-jobmanager-b
    profiles: [second-target]
    command: jobmanager
    restart: unless-stopped
    volumes:
      - ./flink/conf/config-b.yaml:/opt/flink/conf/config.yaml:ro,z
      - flink-state-b:/flink-state
    environment: [ "TZ=${TZ:-UTC}" ]
    mem_limit: 1280m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/overview || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks: [mars]

  taskmanager-b:
    image: ${MARS_FLINK_IMAGE:-${COMPOSE_PROJECT_NAME:-mars}/flink:0.1.0}
    container_name: mars-taskmanager-b
    profiles: [second-target]
    command: taskmanager
    restart: unless-stopped
    depends_on:
      jobmanager-b: { condition: service_healthy }
    volumes:
      - ./flink/conf/config-b.yaml:/opt/flink/conf/config.yaml:ro,z
      - flink-state-b:/flink-state
    environment: [ "TZ=${TZ:-UTC}" ]
    mem_limit: 1536m
    cpus: 0.5
    networks: [mars]

  sql-gateway-b:
    image: ${MARS_FLINK_IMAGE:-${COMPOSE_PROJECT_NAME:-mars}/flink:0.1.0}
    container_name: mars-sql-gateway-b
    profiles: [second-target]
    restart: unless-stopped
    depends_on:
      jobmanager-b: { condition: service_healthy }
    command: >
      /opt/flink/bin/sql-gateway.sh start-foreground
      -Dsql-gateway.endpoint.rest.address=0.0.0.0
      -Dsql-gateway.endpoint.rest.bind-address=0.0.0.0
      -Drest.address=jobmanager-b
      -Drest.port=8081
    volumes:
      - ./flink/conf/config-b.yaml:/opt/flink/conf/config.yaml:ro,z
    environment: [ "TZ=${TZ:-UTC}" ]
    mem_limit: 640m
    cpus: 0.35
    networks: [mars]

volumes:
  flink-state:
  flink-state-b:
  console-data:

networks:
  mars:
